<!DOCTYPE html>
<html>
<head>
<title>Student List - Student Database</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
<h1>Student List</h1>
</header>
<main>
<h2>Student List</h2>

<table border="1" id="table">

<tr>
<th>ID</th>
<th>Name</th>
<th>Class</th>
<th>Phone</th>
<th>Email</th>
</tr>

</table>

<script>

let students = JSON.parse(localStorage.getItem("students")) || [];

let table = document.getElementById("table");

students.forEach(function(s){

let row = table.insertRow();

row.insertCell(0).innerHTML = s.id;
row.insertCell(1).innerHTML = s.name;
row.insertCell(2).innerHTML = s.class;
row.insertCell(3).innerHTML = s.phone;
row.insertCell(4).innerHTML = s.email;

});

</script>
</main>
<footer>
<p>© 2026 Student Database System</p>
</footer>
<script src="js/script.js"></script>
</body>
</html>
